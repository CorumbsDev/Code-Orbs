# Resumo semanal da atividade do repositório (weekly digest).
# Roda toda quarta-feira às 19:00 (Brasília) e abre/atualiza uma Issue
# com commits, PRs e releases — antes da reunião com o professor.

name: Weekly digest

on:
  schedule:
    # Quarta-feira 22:00 UTC = 19:00 Brasília (UTC-3)
    - cron: "0 22 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  digest:
    name: Gerar resumo semanal
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Coletar atividade e publicar Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          SINCE="$(date -u -d '7 days ago' +%Y-%m-%d 2>/dev/null || date -u -v-7d +%Y-%m-%d)"
          UNTIL="$(date -u +%Y-%m-%d)"
          WEEK_LABEL="$(date -u +%Y-W%V)"

          COMMITS="$(git log --since="$SINCE" --pretty=format:'- `%h` %s (%an)' --no-merges | head -n 40)"
          if [ -z "$COMMITS" ]; then
            COMMITS="_Nenhum commit (não-merge) nos últimos 7 dias._"
          fi

          PRS="$(gh pr list --state merged --search "merged:>=$SINCE" --limit 20 \
            --json number,title,mergedAt \
            --jq '.[] | "- #\(.number) \(.title) (\(.mergedAt[:10]))"' || true)"
          if [ -z "$PRS" ]; then
            PRS="_Nenhum PR mergeado nos últimos 7 dias._"
          fi

          RELS="$(gh release list --limit 5 \
            --json tagName,publishedAt,name \
            --jq '.[] | "- [\(.tagName)](../../releases/tag/\(.tagName)) — \(.name // .tagName) (\(.publishedAt[:10]))"' || true)"
          if [ -z "$RELS" ]; then
            RELS="_Nenhuma release listada._"
          fi

          TITLE="Weekly digest $WEEK_LABEL"
          BODY_FILE="$(mktemp)"
          {
            echo "## Weekly digest — $WEEK_LABEL"
            echo
            echo "Período: **$SINCE** → **$UNTIL** (UTC)."
            echo
            echo "### Commits"
            echo "$COMMITS"
            echo
            echo "### Pull requests mergeados"
            echo "$PRS"
            echo
            echo "### Releases recentes"
            echo "$RELS"
            echo
            echo "---"
            echo "Gerado automaticamente por \`.github/workflows/weekly-digest.yml\`."
          } > "$BODY_FILE"

          EXISTING="$(gh issue list --search "in:title \"$TITLE\"" --state open --json number --jq '.[0].number // empty' || true)"

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file "$BODY_FILE"
            echo "Issue #$EXISTING atualizada."
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
            echo "Issue criada."
          fi
