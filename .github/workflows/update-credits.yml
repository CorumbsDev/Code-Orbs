# Inclui no CREDITS autores novos do Git, preservando as descrições (D:) já escritas.
# O commit gerado só altera CREDITS e pede [skip release], então não dispara tag nem o build.

name: Update CREDITS

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "CREDITS"

permissions:
  contents: write

jobs:
  credits:
    name: Atualizar CREDITS
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Atualizar arquivo
        run: python3 scripts/update_credits.py

      - name: Commit se houver autor novo
        run: |
          if git diff --quiet -- CREDITS; then
            echo "Nenhum autor novo."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CREDITS
          git commit -m "docs: atualiza CREDITS com novos contribuidores [skip release]"
          git push
