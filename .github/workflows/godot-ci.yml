# Exporta o Code Orbs (Godot 4.4) para Windows, Linux e Web.
# - Smoke test headless → falha cedo se o projeto não abrir
# - Push/PR em main/master → artifacts Windows/Linux na aba Actions
# - Tag v* (ex.: v1.0.0) → GitHub Release (ZIPs) + Web no GitHub Pages e no itch.io
# Secrets do itch: ITCH_API_KEY, ITCH_GAME (ex.: usuario/code-orbs)
# Baseado em https://github.com/abarichello/godot-ci

name: Build Godot

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore:
      - "CREDITS"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "CREDITS"
  workflow_dispatch:

concurrency:
  group: godot-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.4"
  EXPORT_NAME: code-orbs
  PROJECT_PATH: "."

jobs:
  docs:
    name: Docs e sequência base
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Conferir README e BUILD
        run: python3 scripts/check_docs.py

      - name: Gerar sequência base e conferir sync
        run: |
          python3 tools/gen_plano_aula_sequence.py
          if ! git diff --quiet -- Inventory/fases/scenarios/sequencia_base.tres; then
            echo "::error::sequencia_base.tres divergiu do gerador. Rode localmente: python3 tools/gen_plano_aula_sequence.py e faça commit do .tres."
            git --no-pager diff -- Inventory/fases/scenarios/sequencia_base.tres | head -n 200
            exit 1
          fi
          echo "sequencia_base.tres sincronizada com tools/gen_plano_aula_sequence.py."

  smoke-test:
    name: Smoke test
    needs: [docs]
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Godot
        run: bash scripts/ci_setup_godot.sh

      - name: Checagem GDScript (headless)
        run: |
          cd "$PROJECT_PATH"
          # Importa recursos (erros de fonte no 1º passo são normais).
          godot --headless --path . --import > import.log 2>&1 || true
          godot --headless --path . --script res://tools/validate_plano_aula.gd
          # Abre a cena principal por alguns frames; falha se houver SCRIPT ERROR / parse.
          godot --headless --path . --quit-after 2 > smoke.log 2>&1
          SMOKE_EXIT=$?
          echo "===== import.log ====="
          cat import.log
          echo "===== smoke.log ====="
          cat smoke.log

          FAIL=0
          # Após o import, qualquer SCRIPT ERROR / falha de load é bloqueante.
          if grep -Eiq '^SCRIPT ERROR:|Failed to load script|Compilation failed' smoke.log; then
            echo "::error::Checagem GDScript: SCRIPT ERROR / falha ao carregar script."
            FAIL=1
          fi
          # Parse Error de GDScript (não confundir com Parse Error de .tres no import).
          if grep -Eiq 'SCRIPT ERROR:.*Parse Error|Parse Error:.*(Class |Unexpected|Unterminated|Expected|Identifier)' smoke.log; then
            echo "::error::Checagem GDScript: Parse Error em script."
            FAIL=1
          fi
          if [ "$SMOKE_EXIT" -ne 0 ]; then
            echo "::error::Checagem GDScript: Godot encerrou com código $SMOKE_EXIT."
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "Checagem GDScript OK — projeto abre sem SCRIPT ERROR / parse error."

  export-windows:
    name: Windows
    needs: [smoke-test, docs]
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Godot export templates
        run: bash scripts/ci_setup_godot.sh

      - name: Export Windows
        run: |
          mkdir -v -p build/windows
          EXPORT_DIR="$(readlink -f build)"
          cd "$PROJECT_PATH"
          godot --headless --import || true
          godot --headless --verbose --export-release "Windows Desktop" \
            "$EXPORT_DIR/windows/${EXPORT_NAME}.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows
          path: build/windows
          if-no-files-found: error

  export-linux:
    name: Linux
    needs: [smoke-test, docs]
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Godot export templates
        run: bash scripts/ci_setup_godot.sh

      - name: Export Linux
        run: |
          mkdir -v -p build/linux
          EXPORT_DIR="$(readlink -f build)"
          cd "$PROJECT_PATH"
          godot --headless --import || true
          godot --headless --verbose --export-release "Linux" \
            "$EXPORT_DIR/linux/${EXPORT_NAME}.x86_64"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux
          path: build/linux
          if-no-files-found: error

  export-web:
    name: Web
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [smoke-test, docs]
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Godot export templates
        run: bash scripts/ci_setup_godot.sh

      - name: Export Web
        run: |
          mkdir -v -p build/web
          EXPORT_DIR="$(readlink -f build)"
          cd "$PROJECT_PATH"
          godot --headless --import || true
          godot --headless --verbose --export-release "Web" \
            "$EXPORT_DIR/web/index.html"
          ls -lah "$EXPORT_DIR/web"

      - name: Upload Web artifact
        uses: actions/upload-artifact@v6
        with:
          name: web
          path: build/web
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [export-windows, export-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v6
        with:
          name: windows
          path: dist/windows

      - name: Download Linux build
        uses: actions/download-artifact@v6
        with:
          name: linux
          path: dist/linux

      - name: Pack ZIPs
        id: pack
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release
          # Linux: garantir bit de execução no binário
          find dist/linux -type f -name "*.x86_64" -exec chmod +x {} \;
          (
            cd dist/windows
            zip -r "../../release/${EXPORT_NAME}-${TAG}-windows-x86_64.zip" .
          )
          (
            cd dist/linux
            zip -r "../../release/${EXPORT_NAME}-${TAG}-linux-x86_64.zip" .
          )
          ls -lah release/
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Code Orbs ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release/${{ env.EXPORT_NAME }}-${{ github.ref_name }}-windows-x86_64.zip
            release/${{ env.EXPORT_NAME }}-${{ github.ref_name }}-linux-x86_64.zip
          body: |
            Builds automatizados do **Code Orbs** (Godot 4.4).

            | Arquivo | Plataforma |
            |---|---|
            | `${{ env.EXPORT_NAME }}-${{ github.ref_name }}-windows-x86_64.zip` | Windows |
            | `${{ env.EXPORT_NAME }}-${{ github.ref_name }}-linux-x86_64.zip` | Linux |

            **Windows:** extraia e execute `${{ env.EXPORT_NAME }}.exe`  
            **Linux:** `chmod +x ${{ env.EXPORT_NAME }}.x86_64 && ./${{ env.EXPORT_NAME }}.x86_64`

            **Web:**
            - GitHub Pages: https://corumbsdev.github.io/Code-Orbs/
            - itch.io (canal `html5`): publicada nesta mesma tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    name: GitHub Pages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [export-web]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Web build
        uses: actions/download-artifact@v6
        with:
          name: web
          path: dist/web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-itch:
    name: itch.io Web
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [export-web]
    runs-on: ubuntu-24.04
    steps:
      - name: Download Web build
        uses: actions/download-artifact@v6
        with:
          name: web
          path: dist/web

      - name: Conferir secrets do itch.io
        env:
          ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
          ITCH_GAME: ${{ secrets.ITCH_GAME }}
        run: |
          if [ -z "$ITCH_API_KEY" ] || [ -z "$ITCH_GAME" ]; then
            echo "::error::Defina os secrets ITCH_API_KEY e ITCH_GAME (formato usuario/nome-do-jogo) no repositório."
            exit 1
          fi

      - name: Instalar butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -o butler.zip -d "$HOME/butler"
          chmod +x "$HOME/butler/butler"
          echo "$HOME/butler" >> "$GITHUB_PATH"
          "$HOME/butler/butler" -V

      - name: Publicar HTML5 no itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
          ITCH_GAME: ${{ secrets.ITCH_GAME }}
        run: |
          butler push dist/web "${ITCH_GAME}:html5" --userversion "${GITHUB_REF_NAME}"
