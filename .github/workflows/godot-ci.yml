# Exporta o Code Orbs (Godot 4.4) para Windows e Linux.
# - Smoke test headless → falha cedo se o projeto não abrir
# - Push/PR em main/master → artifacts na aba Actions
# - Tag v* (ex.: v1.0.0) → também cria uma GitHub Release com os ZIPs
# Baseado em https://github.com/abarichello/godot-ci

name: Build Godot

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: godot-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.4"
  EXPORT_NAME: code-orbs
  PROJECT_PATH: "."

jobs:
  smoke-test:
    name: Smoke test
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Godot
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot ~/.config/godot
          fi
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
            ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Checagem GDScript (headless)
        run: |
          cd "$PROJECT_PATH"
          # Importa recursos (erros de fonte no 1º passo são normais).
          godot --headless --path . --import > import.log 2>&1 || true
          # Abre a cena principal por alguns frames; falha se houver SCRIPT ERROR / parse.
          godot --headless --path . --quit-after 2 > smoke.log 2>&1
          SMOKE_EXIT=$?
          echo "===== import.log ====="
          cat import.log
          echo "===== smoke.log ====="
          cat smoke.log

          FAIL=0
          # Após o import, qualquer SCRIPT ERROR / falha de load é bloqueante.
          if grep -Eiq '^SCRIPT ERROR:|Failed to load script|Compilation failed' smoke.log; then
            echo "::error::Checagem GDScript: SCRIPT ERROR / falha ao carregar script."
            FAIL=1
          fi
          # Parse Error de GDScript (não confundir com Parse Error de .tres no import).
          if grep -Eiq 'SCRIPT ERROR:.*Parse Error|Parse Error:.*(Class |Unexpected|Unterminated|Expected|Identifier)' smoke.log; then
            echo "::error::Checagem GDScript: Parse Error em script."
            FAIL=1
          fi
          if [ "$SMOKE_EXIT" -ne 0 ]; then
            echo "::error::Checagem GDScript: Godot encerrou com código $SMOKE_EXIT."
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "Checagem GDScript OK — projeto abre sem SCRIPT ERROR / parse error."

  export-windows:
    name: Windows
    needs: [smoke-test]
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Godot export templates
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot ~/.config/godot
          fi
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
            ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Export Windows
        run: |
          mkdir -v -p build/windows
          EXPORT_DIR="$(readlink -f build)"
          cd "$PROJECT_PATH"
          godot --headless --import || true
          godot --headless --verbose --export-release "Windows Desktop" \
            "$EXPORT_DIR/windows/${EXPORT_NAME}.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows
          path: build/windows
          if-no-files-found: error

  export-linux:
    name: Linux
    needs: [smoke-test]
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Godot export templates
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
            ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Export Linux
        run: |
          mkdir -v -p build/linux
          EXPORT_DIR="$(readlink -f build)"
          cd "$PROJECT_PATH"
          godot --headless --import || true
          godot --headless --verbose --export-release "Linux" \
            "$EXPORT_DIR/linux/${EXPORT_NAME}.x86_64"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux
          path: build/linux
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [export-windows, export-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v6
        with:
          name: windows
          path: dist/windows

      - name: Download Linux build
        uses: actions/download-artifact@v6
        with:
          name: linux
          path: dist/linux

      - name: Pack ZIPs
        id: pack
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release
          # Linux: garantir bit de execução no binário
          find dist/linux -type f -name "*.x86_64" -exec chmod +x {} \;
          (
            cd dist/windows
            zip -r "../../release/${EXPORT_NAME}-${TAG}-windows-x86_64.zip" .
          )
          (
            cd dist/linux
            zip -r "../../release/${EXPORT_NAME}-${TAG}-linux-x86_64.zip" .
          )
          ls -lah release/
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Code Orbs ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release/${{ env.EXPORT_NAME }}-${{ github.ref_name }}-windows-x86_64.zip
            release/${{ env.EXPORT_NAME }}-${{ github.ref_name }}-linux-x86_64.zip
          body: |
            Builds automatizados do **Code Orbs** (Godot 4.4).

            | Arquivo | Plataforma |
            |---|---|
            | `${{ env.EXPORT_NAME }}-${{ github.ref_name }}-windows-x86_64.zip` | Windows |
            | `${{ env.EXPORT_NAME }}-${{ github.ref_name }}-linux-x86_64.zip` | Linux |

            **Windows:** extraia e execute `${{ env.EXPORT_NAME }}.exe`  
            **Linux:** `chmod +x ${{ env.EXPORT_NAME }}.x86_64 && ./${{ env.EXPORT_NAME }}.x86_64`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Android (futuro) ---
  # Descomente quando o preset Android estiver pronto e as secrets existirem:
  # SECRET_RELEASE_KEYSTORE_BASE64, SECRET_RELEASE_KEYSTORE_USER, SECRET_RELEASE_KEYSTORE_PASSWORD
